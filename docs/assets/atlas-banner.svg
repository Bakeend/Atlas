<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Finance — Seu dinheiro, suas regras</title>
  <desc id="desc">Banner azul do projeto Atlas Finance, com ilustração conceitual de um painel de finanças no desktop e em um celular.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#08152F"/>
      <stop offset="48%" stop-color="#0E2C60"/>
      <stop offset="100%" stop-color="#195BC3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8ED4FF"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2F80ED" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#2F80ED" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#010B20" flood-opacity=".3"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="-90" r="410" fill="#66C9FF" opacity=".08"/>
  <circle cx="505" cy="450" r="285" fill="#2F80ED" opacity=".11"/>
  <g transform="translate(70 67)">
