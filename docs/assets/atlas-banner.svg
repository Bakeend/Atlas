  <text x="145" y="114" font-size="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Atlas <tspan fill="#8ED4FF">Finance</tspan></text>
  <text x="71" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#FFFFFF" font-size="31" font-weight="700" letter-spacing="-.5">Seu dinheiro, suas regras.</text>
  <text x="72" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#C6DAF7" font-size="19">Organize, planeje e acompanhe.</text>
  <text x="72" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#C6DAF7" font-size="19">Tudo em um só lugar.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#DCEEFF" text-anchor="middle">
