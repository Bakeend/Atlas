name: Android APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Validate web app
        run: |
          npm run lint
          npm test
          npm run build

      # Plataforma android/ é versionada no repo — dependências vêm do lockfile via npm ci
      - name: Sync web build and native plugins to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Atlas-Financas-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Financas-APK
          path: Atlas-Financas-debug.apk
          if-no-files-found: error
          retention-days: 7
