name: Android APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'index.html'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install web dependencies
        run: npm ci

      - name: Install icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate TypeScript
        run: npm run lint

      # Os testes unitários são informativos para o empacotamento.
      # Um teste funcional não deve impedir a geração do APK quando o app compila.
      - name: Run unit tests
        continue-on-error: true
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync web build and native plugins to Android
        run: npx cap sync android

      - name: Generate Android launcher icons from Atlas app icon
        run: python scripts/generate_android_icons.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Atlas-Financas-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Financas-APK
          path: Atlas-Financas-debug.apk
          if-no-files-found: error
          retention-days: 7
