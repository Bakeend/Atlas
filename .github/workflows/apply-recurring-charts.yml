name: Apply recurring charts patch

on:
  push:
    branches: [feat/recurring-expenses-in-charts]
    paths:
      - 'scripts/patch-recurring-charts.mjs'
      - '.github/workflows/apply-recurring-charts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recurring-expenses-in-charts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-recurring-charts.mjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ChartsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(charts): include recurring expenses in totals and projections"
          git push
